openapi: 3.0.0
info:
  title: Robot Catty API
  description: REST API для управления роботом Robot Catty (Raspberry Pi + Arduino Uno/Mega)
  version: 2.0.0
  contact:
    name: Ruslan Strogov
    url: https://github.com/RuslanStrogov/robot-catty

servers:
  - url: http://localhost:3000
    description: Локальный сервер (замените YOUR_DOMAIN на ваш домен в продакшене)
  - url: http://localhost:3000
    description: Local

tags:
  - name: Status
    description: Статус и состояние системы
  - name: Servo
    description: Управление сервоприводами
  - name: RGB
    description: Установка RGB LED подсветки
  - name: Animation
    description: Анимации робота
  - name: Config
    description: Управление конфигурацией (порты, пины)
  - name: Monitor
    description: Системный мониторинг Raspberry Pi

paths:
  /api/status:
    get:
      tags: [Status]
      summary: Получить текущий статус
      description: Возвращает состояние подключений и текущие позиции серво и RGB
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: object
                    properties:
                      uno: { type: boolean, description: "Arduino Uno connected" }
                      mega: { type: boolean, description: "Arduino Mega connected" }
                  data:
                    type: object
                    properties:
                      servos:
                        type: object
                        properties:
                          eyeL: { type: integer, example: 90 }
                          eyeR: { type: integer, example: 90 }
                          jaw: { type: integer, example: 90 }
                          shoulderL: { type: integer, example: 90 }
                          shoulderR: { type: integer, example: 90 }
                          elbowL: { type: integer, example: 90 }
                          elbowR: { type: integer, example: 90 }
                      rgb:
                        type: object
                        properties:
                          r: { type: integer, example: 255 }
                          g: { type: integer, example: 0 }
                          b: { type: integer, example: 0 }
                      animation:
                        type: string
                        nullable: true

  /api/servo:
    post:
      tags: [Servo]
      summary: Установить угол сервопривода
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servo, angle]
              properties:
                board:
                  type: string
                  enum: [uno, mega]
                  description: "Плата (auto-detect по servo name)"
                servo:
                  type: string
                  enum: [eyeL, eyeR, jaw, shoulderL, shoulderR, elbowL, elbowR]
                  description: Имя сервопривода
                angle:
                  type: integer
                  minimum: 0
                  maximum: 180
                  description: Угол (0-180°)
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }

  /api/rgb:
    post:
      tags: [RGB]
      summary: Установить цвет RGB LED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [r, g, b]
              properties:
                r: { type: integer, minimum: 0, maximum: 255 }
                g: { type: integer, minimum: 0, maximum: 255 }
                b: { type: integer, minimum: 0, maximum: 255 }
      responses:
        '200':
          description: Успешно

  /api/rgb/off:
    post:
      tags: [RGB]
      summary: Выключить RGB LED
      responses:
        '200':
          description: Успешно

  /api/rgb/preset:
    post:
      tags: [RGB]
      summary: Установить пресет цвета
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  enum: [red, green, blue, white, yellow, cyan, magenta, orange, pink, purple]
      responses:
        '200':
          description: Успешно

  /api/animation:
    post:
      tags: [Animation]
      summary: Запустить анимацию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  enum: [wave, nod, shake, blink, lookAround, dance]
                params:
                  type: object
      responses:
        '200':
          description: Анимация запущена

  /api/animation/stop:
    post:
      tags: [Animation]
      summary: Остановить текущую анимацию
      responses:
        '200':
          description: Анимация остановлена

  # ============ CONFIG ============
  /api/config:
    get:
      tags: [Config]
      summary: Получить полную конфигурацию
      description: Возвращает все настройки сервера, портов и пинов
      responses:
        '200':
          description: Конфигурация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
    put:
      tags: [Config]
      summary: Обновить конфигурацию
      description: Частичное или полное обновление. Отсутствующие ключи сохраняются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: Конфигурация обновлена

  /api/config/reset:
    post:
      tags: [Config]
      summary: Сбросить конфигурацию на стандартную
      description: Восстанавливает настройки по умолчанию (из config.default.json)
      responses:
        '200':
          description: Конфигурация сброшена

  /api/config/port/{board}:
    get:
      tags: [Config]
      summary: Получить порт платы
      parameters:
        - in: path
          name: board
          required: true
          schema: { type: string, enum: [uno, mega] }
      responses:
        '200':
          description: Порт платы
    put:
      tags: [Config]
      summary: Изменить порт и скорость платы
      parameters:
        - in: path
          name: board
          required: true
          schema: { type: string, enum: [uno, mega] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                port: { type: string, example: "/dev/ttyUSB1" }
                baud: { type: integer, example: 9600 }
      responses:
        '200':
          description: Порт изменён

  /api/config/pin/{module}/{name}:
    get:
      tags: [Config]
      summary: Получить значение пина
      parameters:
        - in: path
          name: module
          required: true
          schema: { type: string, enum: [head, body, rgb] }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Значение пина
    put:
      tags: [Config]
      summary: Изменить значение пина
      parameters:
        - in: path
          name: module
          required: true
          schema: { type: string, enum: [head, body, rgb] }
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: integer, example: 4 }
      responses:
        '200':
          description: Пин изменён

  # ============ MONITOR ============
  /api/server/status:
    get:
      tags: [Monitor]
      summary: Получить состояние Raspberry Pi
      description: Uptime, CPU, RAM, диск, сеть, напряжение, состояние компонентов
      responses:
        '200':
          description: Статус Pi

  /api/logs:
    get:
      tags: [Monitor]
      summary: Получить лог команд сервера
      description: Последние 50 записей serial и server лога
      responses:
        '200':
          description: Логи

# ============ BOARD LEDS ============
  /api/board-leds:
    get:
      tags: [Status]
      summary: Получить состояние бортовых диодов
      description: "Возвращает { uno: bool, mega: bool }"
      responses:
        '200':
          description: Состояние диодов
    put:
      tags: [Status]
      summary: Включить/выключить бортовой диод на плате
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [board, state]
              properties:
                board:
                  type: string
                  enum: [uno, mega]
                state:
                  type: boolean
                  description: true = включить, false = выключить
      responses:
        '200':
          description: Диод переключён

  /api/board-leds/all-off:
    post:
      tags: [Status]
      summary: Выключить все бортовые диоды (кроме RGB)
      description: Погасить оба бортовых светодиода на Uno и Mega, RGB не трогать
      responses:
        '200':
          description: Все диоды выключены

components:
  schemas:
    Config:
      type: object
      properties:
        server:
          type: object
          properties:
            port: { type: integer, example: 3000 }
            name: { type: string, example: "Robot Catty" }
        serial:
          type: object
          properties:
            uno:
              type: object
              properties:
                port: { type: string }
                baud: { type: integer }
            mega:
              type: object
              properties:
                port: { type: string }
                baud: { type: integer }
        servo_pins:
          type: object
          properties:
            head:
              type: object
              properties:
                eyeL: { type: integer }
                eyeR: { type: integer }
                jaw: { type: integer }
                headRot: { type: integer }
                neckUD: { type: integer }
                neckLR: { type: integer }
            body:
              type: object
              properties:
                shoulderL: { type: integer }
                shoulderR: { type: integer }
                elbowL: { type: integer }
                elbowR: { type: integer }
        rgb_pins:
          type: object
          properties:
            red: { type: integer }
            green: { type: integer }
            blue: { type: integer }